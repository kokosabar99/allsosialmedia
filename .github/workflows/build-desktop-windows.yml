name: Build PROJECT X Desktop Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/build-desktop-windows.yml'
jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies only
        run: npm install --no-workspaces --no-audit --no-fund
      - name: Verify Electron install
        run: npm exec --no -- electron --version
      - name: Build Windows installer
        run: npm run dist --no-workspaces
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-X-Windows-Installer
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
